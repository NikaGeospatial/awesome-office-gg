name: Weekly link check

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        run: npm run check:links
        continue-on-error: true
      - name: Open, update or close the link-rot issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FAILED: ${{ steps.check.outcome == 'failure' }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('link-report.md', 'utf8');
            const failed = process.env.FAILED === 'true';
            const title = 'Weekly link check: dead or moved links';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'link-rot', per_page: 10,
            });
            const existing = open.find((i) => i.title === title);
            if (failed) {
              if (existing) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body: report });
              } else {
                await github.rest.issues.create({ ...context.repo, title, labels: ['link-rot'], body: report });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body: 'All links are healthy again. Closing.',
              });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
            }
