name: Weekly link check

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        run: npm run check:links
        continue-on-error: true
      - name: Open, update or close the link-rot issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILED: ${{ steps.check.outcome == 'failure' }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('link-report.md', 'utf8');
            const failed = process.env.FAILED === 'true';
            const title = 'Weekly link check: dead or moved links';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'link-rot', per_page: 10,
            });
            const existing = open.find((i) => i.title === title);
            if (failed) {
              if (existing) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body: report });
              } else {
                await github.rest.issues.create({ ...context.repo, title, labels: ['link-rot'], body: report });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body: 'All links are healthy again. Closing.',
              });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
            }
