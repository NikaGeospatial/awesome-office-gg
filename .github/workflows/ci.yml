name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # also started by the monthly link-check bot for its PR branch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name "validate" is the required status check on main.
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schema and criteria rules for every game
        run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
