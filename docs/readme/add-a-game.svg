<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 442" width="1200" height="442" role="img" aria-labelledby="add-t add-d">
<title id="add-t">Add a game with one JSON file</title>
<desc id="add-d">A data/games JSON file is typed out line by line, then the CI checks validate, typecheck, tests and build tick green.</desc>
