<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 308" width="1200" height="308" role="img" aria-labelledby="crit-t crit-d">
<title id="crit-t">Every game passes four checks</title>
<desc id="crit-d">Round under one hour, free without an account, easy to learn, and plays in a browser or on a phone.</desc>
<defs>
<pattern id="crit-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#15121a" opacity=".14"/></pattern>
<clipPath id="crit-clip"><rect x="4" y="4" width="1188" height="296"/></clipPath>
</defs>
<style>
.crit text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.crit .b{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900}
.crit .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.crit .c1{animation:cbob 3.4s ease-in-out infinite}
.crit .c2{animation:cbob 3.4s ease-in-out -.8s infinite}
.crit .c3{animation:cbob 3.4s ease-in-out -1.6s infinite}
.crit .c4{animation:cbob 3.4s ease-in-out -2.4s infinite}
.crit .hand{animation:cspin 6s linear infinite;transform-box:fill-box;transform-origin:bottom center}
.crit .coin{animation:cflip 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.crit .glow{animation:cglow 2.4s ease-in-out infinite}
.crit .rays{animation:cglow 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.crit .tap{animation:ctap 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes cspin{to{transform:rotate(360deg)}}
@keyframes cflip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
@keyframes cglow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ctap{0%,70%,100%{transform:scale(1)}80%{transform:scale(.8)}90%{transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g class="crit">
<rect x="14" y="14" width="1188" height="296" fill="#15121a"/>
<rect x="4" y="4" width="1188" height="296" fill="#fff4dc"/>
<rect x="4" y="4" width="1188" height="296" fill="url(#crit-dots)"/>

<g class="c1"><rect x="39" y="39" width="262" height="236" rx="14" fill="#15121a"/><rect x="34" y="34" width="262" height="236" rx="14" fill="#4cc9f0" stroke="#15121a" stroke-width="4" />
<g transform="translate(165 108)"><circle r="38" fill="#fff4dc" stroke="#15121a" stroke-width="5"/><path d="M0 -30 V-24 M30 0 H24 M0 30 V24 M-30 0 H-24" stroke="#15121a" stroke-width="4" stroke-linecap="round"/><rect x="-3" y="-26" width="6" height="26" rx="3" fill="#15121a" class="hand"/><circle r="5" fill="#ff5a45" stroke="#15121a" stroke-width="3"/></g>
<text class="b" x="165" y="184" text-anchor="middle" font-size="40" fill="#15121a">≤ 1 hour</text>
<text x="165" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#15121a">A full round fits</text>
<text x="165" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#15121a">inside the hour.</text></g>
<g class="c2"><rect x="331" y="39" width="262" height="236" rx="14" fill="#15121a"/><rect x="326" y="34" width="262" height="236" rx="14" fill="#3ddc97" stroke="#15121a" stroke-width="4" />
<g transform="translate(457 108)"><g class="coin"><circle r="38" fill="#ffc938" stroke="#15121a" stroke-width="5"/><circle r="28" fill="none" stroke="#15121a" stroke-width="3" stroke-dasharray="3 6"/><text class="b" y="13" text-anchor="middle" font-size="38" fill="#15121a">$</text></g></g>
<text class="b" x="457" y="184" text-anchor="middle" font-size="40" fill="#15121a">$0</text>
<text x="457" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#15121a">Free. No account,</text>
<text x="457" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#15121a">or just a nickname.</text></g>
<g class="c3"><rect x="623" y="39" width="262" height="236" rx="14" fill="#15121a"/><rect x="618" y="34" width="262" height="236" rx="14" fill="#ffc938" stroke="#15121a" stroke-width="4" />
<g transform="translate(749 108)"><g class="rays"><path d="M0 -58 V-48 M-44 -38 L-37 -31 M44 -38 L37 -31 M-52 2 H-42 M52 2 H42" stroke="#15121a" stroke-width="4" stroke-linecap="round"/></g><circle cy="-4" r="30" fill="#ffc938" stroke="#15121a" stroke-width="5"/><rect x="-14" y="24" width="28" height="16" rx="4" fill="#fff4dc" stroke="#15121a" stroke-width="4"/><path d="M-9 -4 L0 8 L9 -4" fill="none" stroke="#15121a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="b" x="749" y="184" text-anchor="middle" font-size="40" fill="#15121a">2 minutes</text>
<text x="749" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#15121a">Rules in a sentence</text>
<text x="749" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#15121a">or two.</text></g>
<g class="c4"><rect x="915" y="39" width="262" height="236" rx="14" fill="#15121a"/><rect x="910" y="34" width="262" height="236" rx="14" fill="#ff8fc7" stroke="#15121a" stroke-width="4" />
<g transform="translate(1041 108)"><rect x="-52" y="-34" width="70" height="52" rx="6" fill="#fff4dc" stroke="#15121a" stroke-width="5"/><path d="M-52 -20 H18" stroke="#15121a" stroke-width="4"/><circle cx="-43" cy="-27" r="2.5" fill="#15121a"/><g class="tap"><rect x="22" y="-24" width="32" height="58" rx="7" fill="#9b6bff" stroke="#15121a" stroke-width="5"/><circle cx="38" cy="26" r="3" fill="#15121a"/></g></g>
<text class="b" x="1041" y="184" text-anchor="middle" font-size="40" fill="#15121a">Tap &amp; go</text>
<text x="1041" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#15121a">Browser tab or</text>
<text x="1041" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#15121a">phone app.</text></g>
<rect x="4" y="4" width="1188" height="296" fill="none" stroke="#15121a" stroke-width="6"/>
</g>
</svg>
