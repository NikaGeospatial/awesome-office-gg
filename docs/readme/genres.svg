<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" width="1200" height="356" role="img" aria-labelledby="gen-t gen-d">
<title id="gen-t">12 genres</title>
<desc id="gen-d">Games per genre on the main list: Social deduction 4, Card games 9, Board games 9, Party 15, Drawing 3, Words &amp; trivia 8, Shooters 9, Arcade &amp; physics 12, Strategy 5, Sports &amp; racing 7, Co-op 4, Puzzle &amp; typing 7.</desc>
<defs>
<pattern id="gen-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#15121a" opacity=".14"/></pattern>
<clipPath id="gen-clip"><rect x="4" y="4" width="1188" height="344"/></clipPath>
</defs>
<style>
.gen text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.gen .b{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900}
.gen .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.gen .g0{animation:gbob 3.6s ease-in-out 0.00s infinite}
.gen .g1{animation:gbob 3.6s ease-in-out 0.37s infinite}
.gen .g2{animation:gbob 3.6s ease-in-out 0.74s infinite}
.gen .g3{animation:gbob 3.6s ease-in-out 1.11s infinite}
.gen .g4{animation:gbob 3.6s ease-in-out 1.48s infinite}
.gen .g5{animation:gbob 3.6s ease-in-out 1.85s infinite}
.gen .g6{animation:gbob 3.6s ease-in-out 2.22s infinite}
.gen .g7{animation:gbob 3.6s ease-in-out 2.59s infinite}
.gen .g8{animation:gbob 3.6s ease-in-out 2.96s infinite}
.gen .g9{animation:gbob 3.6s ease-in-out 3.33s infinite}
.gen .g10{animation:gbob 3.6s ease-in-out 0.10s infinite}
.gen .g11{animation:gbob 3.6s ease-in-out 0.47s infinite}
.gen .num{animation:gnum 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes gbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes gnum{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
