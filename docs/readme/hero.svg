<rect class="mark" x="60" y="176" width="708" height="26" fill="#ffc938"/>
<text class="b" x="64" y="190" font-size="84" fill="#ff5a45" textLength="700" lengthAdjust="spacingAndGlyphs">awesome-office-gg</text>
<text class="b" x="60" y="186" font-size="84" fill="#15121a" textLength="700" lengthAdjust="spacingAndGlyphs">awesome-office-gg</text>
<text x="62" y="244" font-size="34" font-weight="800" fill="#15121a">Games your team can play in one hour.</text>
<text class="m" x="62" y="288" font-size="20" fill="#15121a" opacity=".75">55 free multiplayer games  /  12 genres  /  no sign-up, no install</text>
